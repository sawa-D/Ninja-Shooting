<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<!-- スマホ向けの表示設定：拡大縮小を禁止し、画面の端（ノッチ部分）まで使う -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>鬼退治 ～手裏剣忍法帖～</title>

<!-- PWA（ホーム画面アプリ）用の設定 -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="鬼退治">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14123a">

<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #14123a;
    overflow: hidden;
    touch-action: none;           /* スクロールやダブルタップ拡大を防ぐ */
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<script>
// =====================================================
//  鬼退治 ～手裏剣忍法帖～
//  指でドラッグして忍者を動かす。手裏剣は自動で連射。
// =====================================================

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const FONT = '"Hiragino Mincho ProN", "Yu Mincho", serif';   // 和風に見える明朝体

// ---------- 画面サイズ ----------
let W = 0, H = 0;          // 画面の幅と高さ（CSSピクセル）
let safeTop = 0;           // iPhoneのノッチ分の余白
function resize() {
  const dpr = window.devicePixelRatio || 1;   // 高解像度画面でもくっきり描く
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();
// ノッチの高さ（env(safe-area-inset-top)）を数値で読むための小技
const probe = document.createElement('div');
probe.style.cssText = 'position:fixed;top:0;height:env(safe-area-inset-top);visibility:hidden';
document.body.appendChild(probe);
function readSafeTop() { safeTop = probe.offsetHeight || 0; }
readSafeTop();
window.addEventListener('resize', readSafeTop);

// ---------- ハイスコアの保存（iPhoneの中に残る） ----------
function loadBest() {
  try { return Number(localStorage.getItem('oni-best')) || 0; } catch (e) { return 0; }
}
function saveBest(v) {
  try { localStorage.setItem('oni-best', String(v)); } catch (e) {}
}

// ---------- 効果音（Web Audio で音を合成。和音階＝都節音階） ----------
let audio = null;
const SCALE = [0, 1, 5, 7, 8, 12, 13, 17];   // 都節音階（ミ ファ ラ シ ド…）の半音差
function initAudio() {
  if (audio) return;
  try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
}
// 琴っぽい「ポン」という音
function pluck(semitone, vol = 0.15, len = 0.35) {
  if (!audio) return;
  const t = audio.currentTime;
  const osc = audio.createOscillator();
  const gain = audio.createGain();
  osc.type = 'triangle';
  osc.frequency.value = 330 * Math.pow(2, semitone / 12);
  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + len);
  osc.connect(gain).connect(audio.destination);
  osc.start(t); osc.stop(t + len);
}
// 太鼓っぽい「ドン」という音
function drum(vol = 0.4) {
  if (!audio) return;
  const t = audio.currentTime;
  const osc = audio.createOscillator();
  const gain = audio.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(140, t);
  osc.frequency.exponentialRampToValueAtTime(45, t + 0.3);
  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
  osc.connect(gain).connect(audio.destination);
  osc.start(t); osc.stop(t + 0.4);
}

// ---------- ゲームの状態 ----------
let state = 'title';       // 'title'（タイトル） / 'play'（プレイ中） / 'pause'（一時停止） / 'over'（ゲームオーバー）
let score = 0;
let best = loadBest();
let time = 0;              // プレイ開始からの秒数
let player = null, shurikens = [], enemies = [], items = [], particles = [], petals = [];
let spawnTimer = 0, shotTimer = 0;

// 背景で舞う桜の花びら（ずっと表示）
petals = [];
for (let i = 0; i < 40; i++) petals.push(makePetal(true));
function makePetal(anywhere) {
  return {
    x: Math.random() * W,
    y: anywhere ? Math.random() * H : -10,
    vy: 20 + Math.random() * 40,
    sway: Math.random() * Math.PI * 2,
    size: 3 + Math.random() * 4,
    rot: Math.random() * Math.PI,
  };
}

function resetGame() {
  player = { x: W / 2, y: H * 0.8, r: 14, lives: 3, power: 1, invincible: 0 };
  shurikens = [];   // 自分の手裏剣
  enemies = [];     // 敵
  items = [];       // パワーアップの巻物
  particles = [];   // 爆発の花びら
  score = 0;
  time = 0;
  spawnTimer = 0;
  shotTimer = 0;
}

// ---------- ボタンの位置と大きさ ----------
// 左上のメニューボタン
function menuButton() {
  return { x: 12, y: safeTop + 8, w: 44, h: 44 };
}
// ポーズ中に出る「あきらめる」ボタン（画面の中央）
function giveUpButton() {
  return { x: W / 2 - 100, y: H * 0.5, w: 200, h: 56 };
}
// 点(x, y)がボタンの四角の中にあるか
function inside(x, y, b) {
  return x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h;
}

// ---------- ポーズ・あきらめる ----------
function pause() {
  state = 'pause';
  lastTouch = null;
  pluck(5, 0.1);
}
function resume() {
  state = 'play';
  pluck(7, 0.1);
}
function giveUp() {
  if (score > best) { best = score; saveBest(best); }   // その時点の得点でハイスコアを記録
  state = 'title';
  drum(0.3);
}

// ホーム画面に戻ったり電話が来たりしたら、自動で一時停止する
document.addEventListener('visibilitychange', () => {
  if (document.hidden && state === 'play') pause();
});

// ---------- タッチ操作 ----------
// 指の「動いた量」だけ忍者を動かす（指で忍者が隠れないように）
let lastTouch = null;
canvas.addEventListener('pointerdown', (e) => {
  initAudio();
  if (audio && audio.state === 'suspended') audio.resume();
  const x = e.clientX, y = e.clientY;

  if (state === 'play') {
    if (inside(x, y, menuButton())) { pause(); return; }   // メニューボタン → 一時停止
  } else if (state === 'pause') {
    if (inside(x, y, giveUpButton())) { giveUp(); return; } // あきらめる → タイトルへ
    resume();                                               // それ以外の場所 → 再開
  } else {
    // タイトル画面・ゲームオーバー画面 → ゲーム開始
    resetGame();
    state = 'play';
    drum();
  }
  lastTouch = { x, y };
});
canvas.addEventListener('pointermove', (e) => {
  if (!lastTouch || state !== 'play') return;
  const speed = 1.3;   // 指の動きに対する倍率
  player.x += (e.clientX - lastTouch.x) * speed;
  player.y += (e.clientY - lastTouch.y) * speed;
  player.x = Math.max(player.r, Math.min(W - player.r, player.x));
  player.y = Math.max(safeTop + 60, Math.min(H - player.r - 10, player.y));
  lastTouch = { x: e.clientX, y: e.clientY };
});
const endTouch = () => { lastTouch = null; };
canvas.addEventListener('pointerup', endTouch);
canvas.addEventListener('pointercancel', endTouch);

// ---------- 敵を出す ----------
function spawnEnemy() {
  const level = 1 + time / 30;   // 30秒ごとに難しくなる
  if (Math.random() < 0.25 + Math.min(0.2, time / 300)) {
    // 鬼：大きくて硬い。倒すと巻物を落とすことがある
    enemies.push({ type: 'oni', x: 30 + Math.random() * (W - 60), y: -30,
                   r: 24, hp: 4, vy: 50 * level, t: 0, flash: 0 });
  } else {
    // 鬼火：小さくて速い。ゆらゆら揺れながら落ちてくる
    enemies.push({ type: 'hi', x: 20 + Math.random() * (W - 40), y: -20,
                   r: 12, hp: 1, vy: 90 * level, t: Math.random() * 6, baseX: 0, flash: 0 });
    enemies[enemies.length - 1].baseX = enemies[enemies.length - 1].x;
  }
}

// ---------- 爆発（桜の花びらが散る） ----------
function burst(x, y, color, n = 12) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 60 + Math.random() * 160;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
                     life: 0.6 + Math.random() * 0.4, color, rot: Math.random() * 6 });
  }
}

// 2つの円が重なっているか（当たり判定）
function hit(a, b) {
  const dx = a.x - b.x, dy = a.y - b.y;
  return dx * dx + dy * dy < (a.r + b.r) * (a.r + b.r);
}

// =====================================================
//  毎フレームの更新（dt = 前のフレームからの秒数）
// =====================================================
function update(dt) {
  if (state === 'pause') return;   // 一時停止中は何も動かさない

  // 桜の花びらは常に動かす
  for (const p of petals) {
    p.y += p.vy * dt;
    p.sway += dt;
    p.x += Math.sin(p.sway) * 15 * dt;
    p.rot += dt;
    if (p.y > H + 10) Object.assign(p, makePetal(false));
  }
  // 爆発の粒
  for (const p of particles) {
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.96; p.vy *= 0.96;
    p.life -= dt; p.rot += dt * 5;
  }
  particles = particles.filter(p => p.life > 0);

  if (state !== 'play') return;
  time += dt;

  // --- 手裏剣を自動で連射 ---
  shotTimer -= dt;
  if (shotTimer <= 0) {
    shotTimer = 0.14;
    const n = player.power;                  // パワー1〜3で発射数が増える
    for (let i = 0; i < n; i++) {
      const angle = (i - (n - 1) / 2) * 0.18;  // 扇形に広げる
      shurikens.push({ x: player.x, y: player.y - 16, r: 7,
                       vx: Math.sin(angle) * 520, vy: -Math.cos(angle) * 520, rot: 0 });
    }
  }
  for (const s of shurikens) { s.x += s.vx * dt; s.y += s.vy * dt; s.rot += dt * 20; }
  shurikens = shurikens.filter(s => s.y > -20 && s.x > -20 && s.x < W + 20);

  // --- 敵の出現 ---
  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawnEnemy();
    spawnTimer = Math.max(0.25, 0.9 - time / 100);   // だんだん出現間隔が短くなる
  }

  // --- 敵の移動 ---
  for (const e of enemies) {
    e.t += dt;
    e.y += e.vy * dt;
    if (e.type === 'hi') e.x = e.baseX + Math.sin(e.t * 3) * 40;
    if (e.flash > 0) e.flash -= dt;
  }

  // --- 手裏剣と敵の当たり判定 ---
  for (const e of enemies) {
    for (const s of shurikens) {
      if (!s.dead && e.hp > 0 && hit(s, e)) {
        s.dead = true;
        e.hp--;
        e.flash = 0.08;
        if (e.hp <= 0) {
          if (e.type === 'oni') {
            score += 50;
            burst(e.x, e.y, '#ff9eb8', 20);
            drum(0.3);
            if (Math.random() < 0.3) items.push({ x: e.x, y: e.y, r: 14, vy: 80 });
          } else {
            score += 10;
            burst(e.x, e.y, '#9fd8ff', 10);
            pluck(SCALE[Math.floor(Math.random() * SCALE.length)], 0.08);
          }
        }
      }
    }
  }
  shurikens = shurikens.filter(s => !s.dead);
  enemies = enemies.filter(e => e.hp > 0 && e.y < H + 40);

  // --- 巻物（パワーアップ） ---
  for (const it of items) {
    it.y += it.vy * dt;
    if (hit(it, player)) {
      it.got = true;
      player.power = Math.min(3, player.power + 1);
      score += 100;
      pluck(12, 0.15); setTimeout(() => pluck(17, 0.15), 90);
    }
  }
  items = items.filter(it => !it.got && it.y < H + 20);

  // --- 敵と自分の当たり判定 ---
  if (player.invincible > 0) player.invincible -= dt;
  else {
    for (const e of enemies) {
      if (hit({ x: player.x, y: player.y, r: player.r * 0.6 }, e)) {
        e.hp = 0;
        player.lives--;
        player.power = Math.max(1, player.power - 1);
        player.invincible = 2;   // 2秒間は無敵
        burst(player.x, player.y, '#ffffff', 25);
        drum(0.6);
        if (player.lives <= 0) {
          state = 'over';
          if (score > best) { best = score; saveBest(best); }
        }
        break;
      }
    }
    enemies = enemies.filter(e => e.hp > 0);   // ぶつかった敵を消す
  }
}

// =====================================================
//  描画
// =====================================================
function drawBackground() {
  // 夜空のグラデーション
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0d0b2e');
  g.addColorStop(1, '#2b1e4f');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  // 月
  ctx.save();
  ctx.shadowColor = '#fff3c4'; ctx.shadowBlur = 40;
  ctx.fillStyle = '#fff3c4';
  ctx.beginPath(); ctx.arc(W * 0.78, H * 0.18, Math.min(W, H) * 0.12, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  // 遠くの山（シルエット）
  ctx.fillStyle = '#1a1338';
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 20) ctx.lineTo(x, H * 0.88 - Math.sin(x * 0.012) * 30 - Math.sin(x * 0.031) * 15);
  ctx.lineTo(W, H); ctx.fill();
  // 桜の花びら
  for (const p of petals) drawPetal(p.x, p.y, p.size, p.rot, 'rgba(255,183,205,0.8)');
}

function drawPetal(x, y, size, rot, color) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.ellipse(0, 0, size, size * 0.6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// 忍者（自分）
function drawPlayer() {
  if (player.invincible > 0 && Math.floor(player.invincible * 10) % 2 === 0) return; // 点滅
  const { x, y } = player;
  ctx.save();
  ctx.translate(x, y);
  // 体
  ctx.fillStyle = '#2d2a4a';
  ctx.beginPath(); ctx.moveTo(-14, 18); ctx.lineTo(14, 18); ctx.lineTo(9, -2); ctx.lineTo(-9, -2); ctx.fill();
  // 頭（頭巾）
  ctx.beginPath(); ctx.arc(0, -10, 11, 0, Math.PI * 2); ctx.fill();
  // 目の部分
  ctx.fillStyle = '#f5d6b8';
  ctx.fillRect(-8, -13, 16, 5);
  ctx.fillStyle = '#000';
  ctx.fillRect(-5, -12, 3, 3); ctx.fillRect(2, -12, 3, 3);
  // 赤いはちまき（なびく）
  ctx.strokeStyle = '#d9333f'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-10, -17); ctx.lineTo(10, -17);
  const wave = Math.sin(time * 12) * 3;
  ctx.moveTo(10, -17); ctx.quadraticCurveTo(18, -14 + wave, 24, -8 - wave); ctx.stroke();
  ctx.restore();
}

// 手裏剣（4枚刃の星）
function drawShuriken(x, y, rot, size = 7) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = '#d8dde6';
  ctx.beginPath();
  for (let i = 0; i < 4; i++) {
    const a = i * Math.PI / 2;
    ctx.lineTo(Math.cos(a) * size, Math.sin(a) * size);
    ctx.lineTo(Math.cos(a + Math.PI / 4) * size * 0.35, Math.sin(a + Math.PI / 4) * size * 0.35);
  }
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#555';
  ctx.beginPath(); ctx.arc(0, 0, size * 0.18, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// 鬼火
function drawHitodama(e) {
  ctx.save();
  ctx.translate(e.x, e.y);
  ctx.shadowColor = '#5fc8ff'; ctx.shadowBlur = 18;
  ctx.fillStyle = e.flash > 0 ? '#fff' : '#7fd4ff';
  ctx.beginPath();
  ctx.arc(0, 0, e.r, 0, Math.PI);                          // 下半分の丸
  ctx.quadraticCurveTo(-e.r, -e.r * 1.2, Math.sin(e.t * 8) * 4, -e.r * 2.2); // 炎の先
  ctx.quadraticCurveTo(e.r, -e.r * 1.2, e.r, 0);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#123';
  ctx.beginPath(); ctx.arc(-4, 1, 2, 0, Math.PI * 2); ctx.arc(4, 1, 2, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// 鬼
function drawOni(e) {
  ctx.save();
  ctx.translate(e.x, e.y);
  const r = e.r;
  // 角
  ctx.fillStyle = '#f4e9c8';
  ctx.beginPath(); ctx.moveTo(-r * 0.7, -r * 0.5); ctx.lineTo(-r * 0.45, -r * 1.35); ctx.lineTo(-r * 0.2, -r * 0.7); ctx.fill();
  ctx.beginPath(); ctx.moveTo(r * 0.7, -r * 0.5); ctx.lineTo(r * 0.45, -r * 1.35); ctx.lineTo(r * 0.2, -r * 0.7); ctx.fill();
  // 顔
  ctx.fillStyle = e.flash > 0 ? '#fff' : '#d9333f';
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
  // 眉と目
  ctx.strokeStyle = '#2a0a0a'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-r * 0.6, -r * 0.35); ctx.lineTo(-r * 0.15, -r * 0.15);
  ctx.moveTo(r * 0.6, -r * 0.35); ctx.lineTo(r * 0.15, -r * 0.15); ctx.stroke();
  ctx.fillStyle = '#ffe14d';
  ctx.beginPath(); ctx.arc(-r * 0.35, 0, r * 0.13, 0, Math.PI * 2); ctx.arc(r * 0.35, 0, r * 0.13, 0, Math.PI * 2); ctx.fill();
  // 口と牙
  ctx.fillStyle = '#2a0a0a';
  ctx.fillRect(-r * 0.45, r * 0.35, r * 0.9, r * 0.25);
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.moveTo(-r * 0.4, r * 0.35); ctx.lineTo(-r * 0.28, r * 0.6); ctx.lineTo(-r * 0.16, r * 0.35);
  ctx.moveTo(r * 0.4, r * 0.35); ctx.lineTo(r * 0.28, r * 0.6); ctx.lineTo(r * 0.16, r * 0.35); ctx.fill();
  ctx.restore();
}

// 巻物（パワーアップ）
function drawItem(it) {
  ctx.save();
  ctx.translate(it.x, it.y);
  ctx.rotate(Math.sin(time * 4) * 0.2);
  ctx.fillStyle = '#f4e9c8';
  ctx.fillRect(-12, -7, 24, 14);
  ctx.fillStyle = '#8b2b2b';
  ctx.fillRect(-15, -9, 4, 18); ctx.fillRect(11, -9, 4, 18);
  ctx.fillStyle = '#2a0a0a';
  ctx.font = `bold 11px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('力', 0, 1);
  ctx.restore();
}

// 角の丸い四角を描く（ボタン用）
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// 左上のメニューボタン（三本線のアイコン）
function drawMenuButton() {
  const b = menuButton();
  roundRect(b.x, b.y, b.w, b.h, 10);
  ctx.fillStyle = 'rgba(20,18,58,0.7)';
  ctx.fill();
  ctx.strokeStyle = '#c9a75a';    // 金色の縁取り
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.strokeStyle = '#fff3c4';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.beginPath();
  for (let i = -1; i <= 1; i++) {
    const ly = b.y + b.h / 2 + i * 9;
    ctx.moveTo(b.x + 12, ly);
    ctx.lineTo(b.x + b.w - 12, ly);
  }
  ctx.stroke();
}

// 「あきらめる」ボタン（朱色）
function drawGiveUpButton() {
  const b = giveUpButton();
  roundRect(b.x, b.y, b.w, b.h, 12);
  ctx.fillStyle = '#c8323c';
  ctx.fill();
  ctx.strokeStyle = '#c9a75a';
  ctx.lineWidth = 3;
  ctx.stroke();
  drawText('あきらめる', W / 2, b.y + b.h / 2, 22, '#fff');
}

function drawText(text, x, y, size, color = '#fff', align = 'center') {
  ctx.font = `bold ${size}px ${FONT}`;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillText(text, x + 2, y + 2);
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
}

function draw() {
  drawBackground();

  const inGame = state === 'play' || state === 'pause';
  if (inGame || state === 'over') {
    for (const it of items) drawItem(it);
    for (const e of enemies) e.type === 'oni' ? drawOni(e) : drawHitodama(e);
    for (const s of shurikens) drawShuriken(s.x, s.y, s.rot);
    if (inGame) drawPlayer();
  }
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life);
    drawPetal(p.x, p.y, 5, p.rot, p.color);
  }
  ctx.globalAlpha = 1;

  const top = safeTop + 30;
  if (inGame) {
    // メニューボタン、スコア、残り命
    drawMenuButton();
    drawText(`得点 ${score}`, 68, top, 20, '#fff', 'left');
    drawText('命 ' + '●'.repeat(player.lives) + '○'.repeat(Math.max(0, 3 - player.lives)),
             W - 16, top, 18, '#ff8fa8', 'right');
  }

  if (state === 'pause') {
    // 画面全体を薄暗くする
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, W, H);
    drawText('一時停止', W / 2, H * 0.36, 40, '#fff');
    drawGiveUpButton();
    drawText('ほかの場所をタップで再開', W / 2, H * 0.5 + 100, 16, '#ddd');
  }

  if (state === 'title') {
    drawShuriken(W / 2, H * 0.3, Date.now() / 300, 40);
    drawText('鬼退治', W / 2, H * 0.45, 56, '#fff');
    drawText('～ 手裏剣忍法帖 ～', W / 2, H * 0.45 + 50, 20, '#ffcad6');
    drawText('指でなぞって忍者を動かせ', W / 2, H * 0.65, 16, '#ddd');
    drawText('「力」の巻物で手裏剣が増える', W / 2, H * 0.65 + 28, 16, '#ddd');
    if (Math.floor(Date.now() / 600) % 2 === 0) drawText('― 画面をタップして開始 ―', W / 2, H * 0.8, 18, '#fff3c4');
    if (best > 0) drawText(`最高得点 ${best}`, W / 2, H * 0.88, 16, '#ffcad6');
  }

  if (state === 'over') {
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(0, 0, W, H);
    drawText('無念…', W / 2, H * 0.38, 48, '#ff8fa8');
    drawText(`得点 ${score}`, W / 2, H * 0.5, 28, '#fff');
    drawText(`最高得点 ${best}`, W / 2, H * 0.5 + 40, 20, '#ffcad6');
    drawText('タップでもう一度', W / 2, H * 0.72, 18, '#fff3c4');
  }
}

// =====================================================
//  ゲームループ：「更新 → 描画」を1秒に約60回くり返す
// =====================================================
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);   // 処理落ちしても飛びすぎないように上限
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ---------- オフラインでも遊べるようにする（Service Worker） ----------
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
